name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm and verify toolchain
        run: |
          npm install --global npm@12.2.3
          test "$(node --version)" = "v26.7.0"
          test "$(npm --version)" = "12.2.3"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (Worker dry-run only)
        run: npm run build
      - name: Node/SQLite smoke
        run: npm run smoke:node
      - name: Wrangler-local Worker/D1 smoke
        run: npm run smoke:worker
      - name: Audit production dependencies
        run: npm audit --omit=dev

name: Deploy Cloudflare (manual, gated)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact reviewed 40-character commit SHA on main"
        required: true
        type: string
      confirmation:
        description: "Type deploy followed by a space and that exact SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: store-signal-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_SHA: ${{ github.sha }}
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      CONFIRM_DEPLOY: ${{ inputs.confirmation }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check dispatch identity before checkout
        shell: bash
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$DEPLOY_SHA" ]]
          [[ "$CONFIRM_DEPLOY" == "deploy $DEPLOY_SHA" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm and verify toolchain
        run: |
          npm install --global npm@12.2.3
          test "$(node --version)" = "v26.7.0"
          test "$(npm --version)" = "12.2.3"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Validate code without remote mutation
        run: |
          npm run lint
          npm run typecheck
          npm test
          node --test tests/cloudflare-deploy.test.mjs
          npm run build
          npm run smoke:node
          npm run smoke:worker
          npm audit --omit=dev
      - name: Verify production resources and create temporary config
        run: node scripts/check-cloudflare-deploy.mjs
      - name: Build the reviewed production Worker without deploying
        run: npx --no-install wrangler deploy --dry-run --config packages/runtime-cloudflare/wrangler.production.generated.json
      - name: Deploy exact reviewed Worker (no migrations or provisioning)
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          npx --no-install wrangler deploy --config packages/runtime-cloudflare/wrangler.production.generated.json

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StoreSignal</title><style>body{font:14px system-ui,sans-serif;width:320px;padding:16px;color:#142334;background:#f7fafb}label,select,input,button{display:block;width:100%;box-sizing:border-box;margin:8px 0}button{padding:9px;background:#124e64;color:white;border:0;border-radius:5px;cursor:pointer}input,select{padding:7px}a{overflow-wrap:anywhere;color:#075a70}#result{line-height:1.5}small{color:#425466}</style></head><body><h1>StoreSignal</h1><label for="mode">API mode</label><select id="mode"><option value="hosted">Hosted HTTPS</option><option value="self">Self-hosted</option></select><label for="endpoint">API endpoint (ends in /v1/)</label><input id="endpoint" type="url" placeholder="https://your-api.example/v1/" autocomplete="off"><button id="check" type="button">Check this store</button><div id="result" aria-live="polite"><small>Nothing is sent until you click Check. API must be configured; no live safety verdict without evidence.</small></div><script type="module" src="popup.js"></script></body></html>
